# Build automation for harbor-scanner-clair
#
# CI-aware: local builds target the native arch only, CI builds all platforms.
# Explicit PLATFORMS=... always wins.
#
# Usage:
#   task build                               # native-arch linux binary
#   task build PLATFORMS=linux/amd64,linux/arm64
#   task image                               # CI: multi-arch push, local: native push
#   task image:local                         # single-arch local image (--load)
#   task image:verify IMAGE_TAG=vX.Y.Z       # assert a pushed image has every platform
#   task compose:up && task test:component   # component tier against a real Clair 4.x
---
version: '3'

set:
  - errexit
  - pipefail

dotenv:
  - versions.env

includes:
  helm:
    taskfile: taskfile/helm.yml
    # Chart paths in taskfile/helm.yml are repo-relative, so the tasks must not
    # inherit the included file's own directory as their working directory.
    dir: .
    # taskfile/helm.yml arrives together with deploy/chart. A non-optional
    # include of a missing file makes Task refuse to run any task at all.
    optional: true

vars:
  BINARY: scanner-clair
  IMAGE_NAME: harbor-scanner-clair

  GIT_COMMIT:
    sh: git rev-parse --short=8 HEAD 2>/dev/null || echo "unknown"
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

  GOPATH_BIN:
    sh: echo "${GOBIN:-$(go env GOPATH)/bin}"
  GOBUILD_FLAGS: "-trimpath -buildvcs=false"
  LDFLAGS: >-
    -extldflags=-static -s -w
    -X main.version={{.VERSION}}
    -X main.commit={{.GIT_COMMIT}}
    -X main.date={{.BUILD_DATE}}

  # Multi-arch image build configuration
  # Registry: 8gears.container-registry.com/8gcr/harbor-scanner-clair:<tag>
  REGISTRY_ADDRESS: '{{.REGISTRY_ADDRESS | default "8gears.container-registry.com"}}'
  REGISTRY_PROJECT: '{{.REGISTRY_PROJECT | default "8gcr"}}'
  IMAGE_PLATFORMS: '{{.IMAGE_PLATFORMS | default "linux/amd64,linux/arm64"}}'
  IMAGE_BUILDER: "scanner-multiarch"

  # CI detection: CI builds all platforms, local builds native arch only
  IS_CI:
    sh: '[ -n "${CI:-}${GITHUB_ACTIONS:-}" ] && echo "true" || echo "false"'
  CI_PLATFORMS: '{{ternary .IMAGE_PLATFORMS (printf "linux/%s" ARCH) (eq .IS_CI "true")}}'

tasks:
  default:
    desc: "Build the scanner-clair binary"
    cmds:
      - task: build

  # ============================================================================
  # Build
  # ============================================================================

  build:
    desc: "Build scanner-clair binaries for PLATFORMS (default: native arch, CI: all)"
    vars:
      PLATFORMS: '{{.PLATFORMS | default .CI_PLATFORMS}}'
    cmds:
      - for: {var: PLATFORMS, split: ','}
        task: 'build:binary:{{.ITEM | trim | replace "/" "-"}}'
      - cmd: 'echo "Binaries:"; find bin -type f -exec ls -lh {} \;'
        silent: true

  build:binary:*:
    desc: "Build binary for one platform, e.g. build:binary:linux-arm64"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      GOOS: '{{index (splitList "-" (index .MATCH 0)) 0}}'
      GOARCH: '{{index (splitList "-" (index .MATCH 0)) 1}}'
    # Deliberately no sources/generates caching: the ldflags embed
    # VERSION/GIT_COMMIT/BUILD_DATE, which change without any source change,
    # so Task's fingerprinting would serve binaries with stale metadata.
    # Go's own build cache keeps rebuilds cheap.
    env:
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.GOARCH}}'
      CGO_ENABLED: '0'
    cmds:
      - go build {{.GOBUILD_FLAGS}} -ldflags "{{.LDFLAGS}}" -o bin/{{.PLATFORM}}/{{.BINARY}} ./cmd/harbor-scanner-clair

  dist:binaries:
    desc: "Package adapter binaries from bin/ into dist/ tarballs with checksums"
    vars:
      PLATFORMS: '{{.PLATFORMS | default .CI_PLATFORMS}}'
    cmds:
      - mkdir -p dist
      - |
        for platform in $(echo "{{.PLATFORMS}}" | tr ',' ' '); do
          p=$(echo "$platform" | tr '/' '-')
          if [ ! -x "bin/${p}/{{.BINARY}}" ]; then
            echo "missing bin/${p}/{{.BINARY}} - run 'task build PLATFORMS={{.PLATFORMS}}' first" >&2
            exit 1
          fi
          tar -czf "dist/{{.BINARY}}_${p}.tar.gz" -C "bin/${p}" "{{.BINARY}}"
        done
      - |
        cd dist
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum *.tar.gz > checksums.txt
        else
          shasum -a 256 *.tar.gz > checksums.txt
        fi
        cat checksums.txt

  # ============================================================================
  # Lint & Vulnerability Checks
  # ============================================================================

  lint:
    desc: "Lint Go code with golangci-lint in Docker"
    cmd: >-
      docker run --rm
      -v {{.ROOT_DIR}}:/src -w /src
      golangci/golangci-lint:{{.GOLANGCILINT_VERSION}}-alpine
      golangci-lint run --timeout=10m

  _require-golangci-lint:
    internal: true
    run: once
    status:
      - test -x {{.GOPATH_BIN}}/golangci-lint
      - |
        version='{{.GOLANGCILINT_VERSION}}'
        {{.GOPATH_BIN}}/golangci-lint version | grep -Eq "version v?${version#v}"
    cmd: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCILINT_VERSION}}

  lint:local:
    desc: "Lint Go code with pinned local golangci-lint (used by CI)"
    deps: [_require-golangci-lint]
    cmd: '{{.GOPATH_BIN}}/golangci-lint run --timeout=10m'

  lint:yaml:
    desc: "Lint YAML files with yamllint (.yamllint config)"
    cmds:
      - |
        if command -v yamllint >/dev/null 2>&1; then
          yamllint .
        else
          pipx run yamllint=={{.YAMLLINT_VERSION}} .
        fi

  vuln-check:
    desc: "Scan Go dependencies for known vulnerabilities"
    cmd: go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  vuln-report:
    desc: "Scan and render markdown vulnerability reports into VULN_DIR (used by CI)"
    vars:
      VULN_DIR: '{{.VULN_DIR | default "vulnerability-check"}}'
    cmds:
      - mkdir -p {{.VULN_DIR}}
      # A scan that fails still has to be reported, so the exit code is captured
      # rather than propagated; `vuln-report:check` turns it into a job failure.
      - |
        set +e
        go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} -format json ./... \
          > "{{.VULN_DIR}}/govulncheck.json" 2> "{{.VULN_DIR}}/govulncheck.stderr"
        echo $? > "{{.VULN_DIR}}/govulncheck.exit"
      - task: vuln-report:render
        vars: {VULN_DIR: '{{.VULN_DIR}}', MODE: full, NAME: report}
      # The pull request comment lists only what a reviewer can act on. It must
      # not duplicate the full report in the job summary or its counts.
      - task: vuln-report:render
        vars:
          VULN_DIR: '{{.VULN_DIR}}'
          MODE: fixable
          NAME: comment
          EXTRA_FLAGS: "-step-summary=false -github-output=false"
      - cmd: echo "Reports written to {{.VULN_DIR}}/ (report.md, comment.md, report-summary.json)"
        silent: true

  vuln-report:render:
    internal: true
    vars:
      MAX_ROWS: '{{.MAX_ROWS | default "50"}}'
    cmd: >-
      go run ./tools/govulncheck-report
      -json "{{.VULN_DIR}}/govulncheck.json"
      -stderr "{{.VULN_DIR}}/govulncheck.stderr"
      -exit-file "{{.VULN_DIR}}/govulncheck.exit"
      -mode {{.MODE}}
      -max-rows {{.MAX_ROWS}}
      -out "{{.VULN_DIR}}/{{.NAME}}.md"
      -summary "{{.VULN_DIR}}/{{.NAME}}-summary.json"
      {{.EXTRA_FLAGS}}

  vuln-report:check:
    desc: "Fail if the last vuln-report run could not produce a usable govulncheck report"
    vars:
      VULN_DIR: '{{.VULN_DIR | default "vulnerability-check"}}'
    cmd: >-
      go run ./tools/govulncheck-report
      -json "{{.VULN_DIR}}/govulncheck.json"
      -stderr "{{.VULN_DIR}}/govulncheck.stderr"
      -exit-file "{{.VULN_DIR}}/govulncheck.exit"
      -out /dev/null -step-summary=false -github-output=false
      -fail-on-scanner-error

  # ============================================================================
  # Tests
  # ============================================================================

  test:
    desc: "Run unit tests with race detection and coverage"
    env:
      # -race requires cgo; some CI runner images export CGO_ENABLED=0
      CGO_ENABLED: "1"
    cmd: go test -short -race -coverprofile=coverage.txt -covermode=atomic ./...

  test:postgres:
    desc: "Run the Postgres store and queue tests against a throwaway container"
    vars:
      PG_CONTAINER: harbor-scanner-clair-test-postgres
      # CLAIR_POSTGRES_VERSION comes from versions.env once the chart pins it;
      # until then the default keeps this task self-contained.
      PG_VERSION: '{{.CLAIR_POSTGRES_VERSION | default "15"}}'
      PG_PORT: '{{.PG_PORT | default "15432"}}'
    env:
      # -race requires cgo; some CI runner images export CGO_ENABLED=0
      CGO_ENABLED: "1"
      SCANNER_TEST_POSTGRES_URL: 'postgres://scanner:scanner@localhost:{{.PG_PORT}}/scanner?sslmode=disable'
    cmds:
      # Removing the container on the way out as well as on the way in: a failed
      # test run must not leave a listener on PG_PORT behind.
      - defer: docker rm -f {{.PG_CONTAINER}} >/dev/null 2>&1 || true
      - |
        docker rm -f {{.PG_CONTAINER}} >/dev/null 2>&1 || true
        docker run -d --rm --name {{.PG_CONTAINER}} \
          -e POSTGRES_PASSWORD=scanner -e POSTGRES_USER=scanner -e POSTGRES_DB=scanner \
          -p {{.PG_PORT}}:5432 postgres:{{.PG_VERSION}} >/dev/null
        # `cmd && break` would abort the whole task under errexit the first time
        # the container is not up yet, so the probe goes in an if.
        for _ in $(seq 1 60); do
          if docker exec {{.PG_CONTAINER}} pg_isready -U scanner -d scanner >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done
        docker exec {{.PG_CONTAINER}} pg_isready -U scanner -d scanner
      - go test -count=1 -race ./pkg/persistence/postgres/... ./pkg/queue/...

  test:all:
    desc: "Run every test tier that can run without external services"
    cmds:
      - task: test

  test:component:
    desc: "Run the component tier against the compose stack (requires task compose:up)"
    cmd: go test -tags=component -count=1 -timeout=60m -v ./test/component/...

  compose:up:
    desc: "Start the component-tier stack: Clair 4.x, Postgres, a registry and the adapter"
    vars:
      COMPOSE_FILE: test/component/docker-compose.yml
    cmds:
      # The image is built from bin/linux-<arch>/, so the binary has to exist
      # before docker reads the Dockerfile. Native arch only: the tier runs one
      # adapter on the host's own architecture.
      - task: build
        vars: {PLATFORMS: 'linux/{{ARCH}}'}
      - docker compose -f {{.COMPOSE_FILE}} up -d --wait --build
      # Seeding is its own step because the seed container exits, and `up --wait`
      # reads an exited container as a failed service.
      - docker compose -f {{.COMPOSE_FILE}} run --rm seed

  compose:down:
    desc: "Stop the component-tier stack and delete its volumes"
    cmd: docker compose -f test/component/docker-compose.yml down -v --remove-orphans

  # ============================================================================
  # Container Image
  # ============================================================================

  buildx:setup:
    internal: true
    run: once
    status:
      - docker buildx inspect {{.IMAGE_BUILDER}} >/dev/null 2>&1
    cmds:
      - docker buildx create --name {{.IMAGE_BUILDER}} --driver docker-container --bootstrap

  image:
    desc: "Build container image (PUSH=false to --load locally, PLATFORMS=... to override)"
    vars:
      PUSH: '{{.PUSH | default "true"}}'
      PLATFORMS: '{{.PLATFORMS | default (ternary (printf "linux/%s" ARCH) .CI_PLATFORMS (eq .PUSH "false"))}}'
      IMAGE_TAG: '{{.IMAGE_TAG | default .VERSION}}'
      OUTPUT: '{{ternary "--push" "--load" (eq .PUSH "true")}}'
      TAG_PREFIX: '{{ternary (printf "%s/%s/" .REGISTRY_ADDRESS .REGISTRY_PROJECT) "" (eq .PUSH "true")}}'
      FULL_TAG: '{{.TAG_PREFIX}}{{.IMAGE_NAME}}:{{.IMAGE_TAG}}'
    preconditions:
      - sh: '{{if and (ne .PUSH "true") (contains "," .PLATFORMS)}}exit 1{{end}}'
        msg: "PUSH=false requires a single platform (--load limitation)"
    cmds:
      - task: build
        vars: {PLATFORMS: '{{.PLATFORMS}}'}
      - task: buildx:setup
      - >-
        docker buildx build
        --builder {{.IMAGE_BUILDER}}
        --platform {{.PLATFORMS}}
        --build-arg ALPINE_BASE_IMAGE_VERSION={{.ALPINE_BASE_IMAGE_VERSION}}
        --build-arg LPROBE_VERSION={{.LPROBE_VERSION}}
        -t {{.FULL_TAG}}
        {{.OUTPUT}}
        .

  image:local:
    desc: "Build local image {{.IMAGE_NAME}}:<version> for local testing (native arch)"
    cmds:
      - task: image
        vars: {PUSH: "false"}

  image:verify:
    desc: "Verify a pushed image index carries exactly IMAGE_PLATFORMS (IMAGE_REF=... or IMAGE_TAG=... to select)"
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG | default .VERSION}}'
      IMAGE_REF: '{{.IMAGE_REF | default (printf "%s/%s/%s:%s" .REGISTRY_ADDRESS .REGISTRY_PROJECT .IMAGE_NAME .IMAGE_TAG)}}'
      PLATFORMS: '{{.PLATFORMS | default .IMAGE_PLATFORMS}}'
    preconditions:
      - sh: docker buildx version >/dev/null 2>&1
        msg: "docker buildx is required to inspect a published image index"
      - sh: command -v jq >/dev/null 2>&1
        msg: "jq is required to inspect a published image index"
    cmds:
      - cmd: |
          reference='{{.IMAGE_REF}}'
          # grep exits 1 on an all-empty list, which errexit would turn into a
          # silent abort before the guard below can say what is wrong.
          expected=$(printf '%s' '{{.PLATFORMS}}' | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$' | sort -u || true)
          if [ -z "${expected}" ]; then
            echo "No expected platforms given (PLATFORMS/IMAGE_PLATFORMS is empty)" >&2
            exit 1
          fi

          if ! raw=$(docker buildx imagetools inspect --raw "${reference}" 2>&1); then
            echo "Cannot inspect ${reference}: ${raw}" >&2
            exit 1
          fi

          if ! media_type=$(printf '%s' "${raw}" | jq -r '.mediaType // ""' 2>/dev/null); then
            echo "Manifest of ${reference} is not valid JSON" >&2
            exit 1
          fi
          if [ "${media_type}" != "application/vnd.oci.image.index.v1+json" ]; then
            echo "Not a multi-arch OCI image index: ${reference} (mediaType: ${media_type:-none})" >&2
            exit 1
          fi

          # buildx records provenance/SBOM attestations as unknown/unknown entries
          # of the index; they are attachments, not platforms.
          actual=$(printf '%s' "${raw}" \
            | jq -r '.manifests[]? | "\(.platform.os // "?")/\(.platform.architecture // "?")" | select(. != "unknown/unknown")' \
            | sort)
          if [ -z "${actual}" ]; then
            echo "No platform manifests in ${reference}" >&2
            exit 1
          fi

          failed=0
          for platform in ${expected}; do
            printf '%s\n' "${actual}" | grep -Fqx "${platform}" || {
              echo "Missing ${platform} manifest in ${reference}" >&2
              failed=1
            }
          done
          for platform in ${actual}; do
            printf '%s\n' "${expected}" | grep -Fqx "${platform}" || {
              echo "Unexpected ${platform} manifest in ${reference}" >&2
              failed=1
            }
          done
          duplicates=$(printf '%s\n' "${actual}" | uniq -d)
          if [ -n "${duplicates}" ]; then
            echo "Duplicate platform manifests in ${reference}: $(printf '%s' "${duplicates}" | tr '\n' ' ')" >&2
            failed=1
          fi
          [ "${failed}" -eq 0 ] || exit 1

          echo "Verified ${reference}: $(printf '%s' "${actual}" | tr '\n' ' ')"
        silent: true

  # ============================================================================
  # Development
  # ============================================================================

  run:
    desc: "Run the scanner locally with debug logging (requires a Clair 4.x at SCANNER_CLAIR_URL)"
    env:
      SCANNER_LOG_LEVEL: debug
      SCANNER_API_SERVER_ADDR: ':8080'
      SCANNER_CLAIR_URL: '{{.SCANNER_CLAIR_URL | default "http://localhost:6060"}}'
      SCANNER_CLAIR_PSK: '{{.SCANNER_CLAIR_PSK | default ""}}'
      # memory, so a bare `task run` needs no database. Pass
      # SCANNER_STORE_BACKEND=postgres with a DSN to exercise the production path.
      SCANNER_STORE_BACKEND: '{{.SCANNER_STORE_BACKEND | default "memory"}}'
      SCANNER_STORE_POSTGRES_URL: '{{.SCANNER_STORE_POSTGRES_URL | default ""}}'
    cmds:
      - go run ./cmd/harbor-scanner-clair

  setup:
    desc: "Install pinned development tools and git hooks"
    cmds:
      - task: _require-golangci-lint
      - go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
      - cmd: |
          if [ -f lefthook.yml ]; then
            if command -v lefthook >/dev/null 2>&1; then
              lefthook install
            else
              echo "lefthook not installed; install it (e.g. 'brew install lefthook') and run 'lefthook install'"
            fi
          fi
        silent: true

  clean:
    desc: "Remove build artifacts, packaged charts, and coverage output"
    cmds:
      - rm -rf bin/ dist/ coverage.txt

  info:
    desc: "Print version, tool pins, and build configuration"
    silent: true
    cmds:
      - |
        echo ""
        echo "harbor-scanner-clair build information"
        echo ""
        echo "Build metadata:"
        echo "  Version:        {{.VERSION}}"
        echo "  Git commit:     {{.GIT_COMMIT}}"
        echo "  Build date:     {{.BUILD_DATE}}"
        echo "  Go build flags: {{.GOBUILD_FLAGS}}"
        echo "  Output:         bin/<os>-<arch>/{{.BINARY}}"
        echo ""
        echo "Image configuration:"
        echo "  Image:          {{.REGISTRY_ADDRESS}}/{{.REGISTRY_PROJECT}}/{{.IMAGE_NAME}}"
        echo "  Platforms:      {{.CI_PLATFORMS}} (CI: {{.IMAGE_PLATFORMS}})"
        echo ""
        echo "Tool pins (versions.env):"
        echo "  Alpine base:    {{.ALPINE_BASE_IMAGE_VERSION}}"
        echo "  golangci-lint:  {{.GOLANGCILINT_VERSION}}"
        echo "  govulncheck:    {{.GOVULNCHECK_VERSION}}"
        echo "  Task (CI):      {{.TASK_VERSION}}"
        echo "  typos:          {{.TYPOS_VERSION}}"
        echo "  yamllint:       {{.YAMLLINT_VERSION}}"
        echo ""
        echo "Component tier backend (versions.env, compose and examples only):"
        echo "  Clair:          {{.CLAIR_VERSION}}"
        echo "  PostgreSQL:     {{.CLAIR_POSTGRES_VERSION}}"
        echo ""
