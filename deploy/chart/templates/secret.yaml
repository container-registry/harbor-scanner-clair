{{/*
Chart-managed credential Secret: the inlined pre-shared key, the inlined store
DSN, or both. Whatever is externally owned (clair.existingSecret,
postgres.existingSecret) stays in a Secret the chart never reads or owns, and
the document disappears entirely when nothing is inlined.
*/}}
{{- $psk := and .Values.clair.psk (not .Values.clair.existingSecret) }}
{{- /* Derived from the same helper the env var uses, so the key exists exactly
     when something references it. */}}
{{- $dsn := eq (include "harbor-scanner-clair.postgres.secretName" .) (include "harbor-scanner-clair.fullname" .) }}
{{- if or $psk $dsn }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harbor-scanner-clair.fullname" . }}
  namespace: {{ include "harbor-scanner-clair.namespace" . }}
  labels:
    {{- include "harbor-scanner-clair.labels" . | nindent 4 }}
  {{- with (include "harbor-scanner-clair.annotations" (dict "root" . "local" dict)) }}
  annotations:
    {{- . | trim | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if $psk }}
  {{- /* Double base64 is correct: `data` is base64 of the raw value, and the raw
       value is itself the base64 key Clair's auth.psk.key takes. */}}
  psk: {{ .Values.clair.psk | b64enc | quote }}
  {{- end }}
  {{- if $dsn }}
  url: {{ .Values.postgres.url | b64enc | quote }}
  {{- end }}
{{- end }}
