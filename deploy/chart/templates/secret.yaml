{{/*
Only rendered for a chart-managed Clair database DSN. With clair.existingSecret
the DSN stays in a Secret the chart never reads or owns.
*/}}
{{- if and .Values.clair.databaseUrl (not .Values.clair.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harbor-scanner-clair.fullname" . }}
  namespace: {{ include "harbor-scanner-clair.namespace" . }}
  labels:
    {{- include "harbor-scanner-clair.labels" . | nindent 4 }}
  {{- with (include "harbor-scanner-clair.annotations" (dict "root" . "local" dict)) }}
  annotations:
    {{- . | trim | nindent 4 }}
  {{- end }}
type: Opaque
data:
  databaseUrl: {{ .Values.clair.databaseUrl | b64enc | quote }}
{{- end }}
