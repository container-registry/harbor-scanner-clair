{{/*
Same notation as .Values.config, rendered into a Secret instead, so the values
never appear in the pod spec.
*/}}
{{- if .Values.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-env" (include "harbor-scanner-clair.fullname" .) }}
  namespace: {{ include "harbor-scanner-clair.namespace" . }}
  labels:
    {{- include "harbor-scanner-clair.labels" . | nindent 4 }}
  {{- with (include "harbor-scanner-clair.annotations" (dict "root" . "local" dict)) }}
  annotations:
    {{- . | trim | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- include "harbor-scanner-clair.toEnvVars" (dict "values" .Values.secret "prefix" "" "isSecret" true) | nindent 2 }}
{{- end }}
