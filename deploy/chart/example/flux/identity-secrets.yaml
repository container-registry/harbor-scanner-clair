---
# PLACEHOLDERS. Replace with SealedSecrets, SOPS-encrypted Secrets, or
# ExternalSecrets producing the same names and keys - never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: harbor-scanner-clair-redis
  namespace: harbor
type: Opaque
stringData:
  # Complete URL; the password lives here rather than in the pod spec.
  url: redis://:REPLACE_ME@harbor-redis:6379/5
---
apiVersion: v1
kind: Secret
metadata:
  name: harbor-scanner-clair-database
  namespace: harbor
type: Opaque
stringData:
  # Clair's own PostgreSQL DSN. Read for one query, the vulnerability database
  # timestamp in /api/v1/metadata. Omit the whole Secret to do without it.
  databaseUrl: postgres://clair:REPLACE_ME@clair-postgres:5432/clair?sslmode=disable
