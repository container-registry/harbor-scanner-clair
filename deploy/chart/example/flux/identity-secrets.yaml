---
# PLACEHOLDERS. Replace with SealedSecrets, SOPS-encrypted Secrets, or
# ExternalSecrets producing the same names and keys - never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: harbor-scanner-clair-postgres
  namespace: harbor
type: Opaque
stringData:
  # Complete DSN; the password lives here rather than in the release. The
  # database is the adapter's own on Clair's PostgreSQL, and its role has to be
  # able to create the scan_job table.
  url: postgres://clair:REPLACE_ME@clair-postgres.clair.svc:5432/scanner?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: harbor-scanner-clair-psk
  namespace: harbor
type: Opaque
stringData:
  # Clair's pre-shared key, base64 as Clair's own auth.psk.key takes it. Omit
  # the whole Secret for a Clair with no auth stanza.
  psk: REPLACE_ME_BASE64
