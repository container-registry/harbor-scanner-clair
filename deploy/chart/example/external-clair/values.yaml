---
# Adapter pointed at the Clair deployed by clair.yaml in this directory.
clair:
  url: http://clair.clair.svc:6060
  # Created by the kubectl command in README.md, in the adapter's namespace,
  # holding the same key as clair.yaml's auth.psk.key.
  existingSecret: clair-psk
  existingSecretKey: psk

postgres:
  # Created by the second kubectl command in README.md, in the adapter's
  # namespace, holding the DSN for the `scanner` database on Clair's PostgreSQL.
  existingSecret: harbor-scanner-clair-postgres
  existingSecretKey: url
