---
# Evaluation-grade PostgreSQL for Clair. NOT for production: a single replica
# and a password in a manifest. Swap it for your own database.
#
# A StatefulSet with a real volume rather than a Deployment with an emptyDir,
# because losing this database now costs a full updater cycle: Clair refetches
# every feed from scratch, which is minutes of wall time and a large memory
# spike, not the few seconds a restart used to cost.
apiVersion: v1
kind: Namespace
metadata:
  name: clair
---
apiVersion: v1
kind: Secret
metadata:
  name: clair-postgres
  namespace: clair
type: Opaque
stringData:
  POSTGRES_USER: clair
  POSTGRES_PASSWORD: REPLACE_ME
  POSTGRES_DB: clair
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clair-postgres-init
  namespace: clair
data:
  # Files in /docker-entrypoint-initdb.d run once, on an empty data directory,
  # against POSTGRES_DB - which is Clair's own database.
  #
  # Clair's migrations call uuid_generate_v4(), so the extension has to exist
  # before Clair first connects.
  10-uuid-ossp.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
  # The adapter's scan_job table lives on the same server in a database of its
  # own, so Clair's migrations and the adapter's startup DDL never meet. The
  # adapter creates the table itself on first start; POSTGRES_USER owns this
  # database and can, which is why the DSN in the README names that role.
  20-scanner-db.sql: |
    CREATE DATABASE scanner;
---
apiVersion: v1
kind: Service
metadata:
  name: clair-postgres
  namespace: clair
spec:
  selector:
    app: clair-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clair-postgres
  namespace: clair
spec:
  serviceName: clair-postgres
  replicas: 1
  selector:
    matchLabels:
      app: clair-postgres
  template:
    metadata:
      labels:
        app: clair-postgres
    spec:
      containers:
        # 15 is what Clair's own local-dev compose pins.
        - name: postgres
          image: postgres:15
          envFrom:
            - secretRef:
                name: clair-postgres
          env:
            # The image refuses to initialise into a directory that already has
            # the lost+found of a mounted volume, so give it a subdirectory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: clair-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
