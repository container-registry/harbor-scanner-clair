---
apiVersion: v2
name: harbor-scanner-clair
description: A production-ready Helm chart for the Harbor Scanner Adapter for
  Clair - the vulnerability scanner adapter that fronts an external CoreOS Clair
  2.x.
type: application
version: 1.0.0
# appVersion tracks the adapter release; the app release-please line rewrites
# this line, the chart release-please line rewrites `version` above.
appVersion: "v1.1.1" # x-release-please-version
kubeVersion: ">=1.28.0-0"

home: https://github.com/container-registry/harbor-scanner-clair
icon: https://raw.githubusercontent.com/goharbor/website/main/static/img/logos/harbor-icon-color.svg
sources:
  - https://github.com/container-registry/harbor-scanner-clair

keywords:
  - harbor
  - clair
  - coreos
  - scanner
  - vulnerability
  - vulnerability-scanning
  - security
  - container-registry
  - cloud-native

# Artifact Hub only counts a maintainer that carries an email address.
maintainers:
  - name: 8gears
    email: vadim@8gears.com
    url: https://github.com/container-registry/harbor-scanner-clair

# Artifact Hub metadata (https://artifacthub.io/docs/topics/annotations/helm/).
# Keep this the LAST top-level key: the release pipeline appends the
# per-release artifacthub.io/images annotation to this block before
# packaging (the image tag is only known at release time).
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: security
  artifacthub.io/operator: "false"
  # No artifacthub.io/signKey: Artifact Hub parses it as a PGP key id and URL,
  # and this chart is signed keyless with Sigstore, which has no static key.
  # Verification is a cosign command, linked below and documented in the README.
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/container-registry/harbor-scanner-clair/tree/main/deploy/chart
    - name: Verifying the chart signature (cosign, keyless)
      url: https://github.com/container-registry/harbor-scanner-clair/blob/main/deploy/chart/README.md#verifying-the-chart-signature
    - name: Clair 2.x prerequisite
      url: https://github.com/container-registry/harbor-scanner-clair/blob/main/deploy/chart/README.md#prerequisites
    - name: Moving from the kube/ manifests
      url: https://github.com/container-registry/harbor-scanner-clair/blob/main/deploy/chart/docs/FROM-KUBE-MANIFESTS.md
    - name: Harbor
      url: https://goharbor.io
