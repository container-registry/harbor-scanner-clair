---
# Every guard in templates/validate-values.yaml. These are the mistakes that
# would otherwise surface as a CrashLoopBackOff, a Pending pod, or a silently
# wrong scan, so each one has to keep failing the render.
suite: value validation
release:
  name: t
templates:
  - validate-values.yaml
tests:
  - it: accepts the defaults
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses TLS with no certificate material
    set:
      api.tls.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "api.tls.enabled requires either api.tls.existingSecret, or both api.tls.certificate and api.tls.key."

  - it: refuses two competing TLS sources
    set:
      api.tls.enabled: true
      api.tls.existingSecret: s
      api.tls.certificate: c
      api.tls.key: k
    asserts:
      - failedTemplate:
          errorMessage: "Set either api.tls.existingSecret or api.tls.certificate/api.tls.key, not both."

  - it: refuses an empty Clair URL
    set:
      clair.url: ""
    asserts:
      - failedTemplate:
          errorMessage: "clair.url must name the Clair 4.x API endpoint the adapter indexes against; the chart does not deploy Clair."

  - it: refuses a Clair existingSecret with no key
    set:
      clair.existingSecret: s
      clair.existingSecretKey: ""
    asserts:
      - failedTemplate:
          errorMessage: "clair.existingSecretKey must name the key holding the base64 pre-shared key in clair.existingSecret."

  - it: refuses a pre-shared key that is both inlined and externally owned
    set:
      clair.existingSecret: s
      clair.psk: c2VjcmV0
    asserts:
      - failedTemplate:
          errorMessage: "Set either clair.existingSecret or clair.psk, not both."

  - it: refuses an empty issuer while a pre-shared key is set
    set:
      clair.psk: c2VjcmV0
      clair.jwtIssuer: ""
    asserts:
      - failedTemplate:
          errorMessage: "clair.jwtIssuer must not be empty when a pre-shared key is set: Clair validates the JWT `iss` claim against its auth.psk.iss allow-list, and an empty issuer matches nothing."

  - it: refuses a ServiceMonitor with no metrics endpoint to scrape
    set:
      metrics.enabled: false
      metrics.serviceMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "metrics.serviceMonitor.enabled requires metrics.enabled: the adapter would serve no /metrics endpoint to scrape."

  - it: refuses the memory backend with more than one replica
    set:
      store.backend: memory
      replicaCount: 3
    asserts:
      - failedTemplate:
          errorMessage: "store.backend: memory keeps scan reports in one pod's memory, so a second replica answers Harbor's report poll with 404. Use the postgres backend, or pin replicaCount to 1 with autoscaling off."

  - it: refuses the memory backend under an autoscaler
    set:
      store.backend: memory
      autoscaling.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "store.backend: memory keeps scan reports in one pod's memory, so a second replica answers Harbor's report poll with 404. Use the postgres backend, or pin replicaCount to 1 with autoscaling off."

  - it: refuses the postgres backend with no connection string to use
    set:
      postgres.url: ""
    asserts:
      - failedTemplate:
          errorMessage: "store.backend: postgres needs a database: set postgres.url, or postgres.existingSecret to read the connection string from a Secret. This chart deploys no PostgreSQL; the adapter's table belongs in its own database on Clair's instance, which example/external-clair/ creates."

  - it: accepts an empty postgres URL on the memory backend
    # The memory backend opens no pool, so the guard above must not fire for a
    # development install that deliberately has no database.
    set:
      postgres.url: ""
      store.backend: memory
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses a postgres existingSecret with no key
    set:
      postgres.existingSecret: s
      postgres.existingSecretKey: ""
    asserts:
      - failedTemplate:
          errorMessage: "postgres.existingSecretKey must name the key holding the connection string in postgres.existingSecret."

  - it: refuses a PDB with both minAvailable and maxUnavailable
    set:
      podDisruptionBudget.enabled: true
      podDisruptionBudget.minAvailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "podDisruptionBudget accepts minAvailable or maxUnavailable, not both."

  - it: refuses a PDB with neither
    set:
      podDisruptionBudget.enabled: true
      podDisruptionBudget.maxUnavailable: ""
    asserts:
      - failedTemplate:
          errorMessage: "podDisruptionBudget.enabled requires either minAvailable or maxUnavailable."

  - it: refuses an inverted autoscaling range
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 9
      autoscaling.maxReplicas: 5
    asserts:
      - failedTemplate:
          errorMessage: "autoscaling.minReplicas must not exceed autoscaling.maxReplicas."

  - it: refuses autoscaling with no metric to scale on
    set:
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: null
    asserts:
      - failedTemplate:
          errorMessage: "autoscaling.enabled requires at least one metric: targetCPUUtilizationPercentage, targetMemoryUtilizationPercentage, or autoscaling.metrics."

  - it: refuses two competing CA sources
    set:
      extraCA.existingSecret: a
      extraCA.existingConfigMap: b
    asserts:
      - failedTemplate:
          errorMessage: "Set either extraCA.existingSecret or extraCA.existingConfigMap, not both."

  - it: refuses credentials smuggled into config through a URL
    set:
      config:
        SCANNER_STORE_POSTGRES_URL: postgres://user:s3cret@clair-postgres:5432/scanner
    asserts:
      - failedTemplate:
          errorMessage: "config.SCANNER_STORE_POSTGRES_URL embeds credentials in a URL, and config renders into a ConfigMap. Move it to `secret`, which takes the same notation."

  - it: accepts a credential-free URL in config
    set:
      config:
        SCANNER_STORE_POSTGRES_URL: postgres://clair-postgres:5432/scanner?sslmode=disable
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses a commonLabel that would override a selector label
    set:
      commonLabels:
        app.kubernetes.io/name: mine
    asserts:
      - failedTemplate:
          errorPattern: "selector label owned by the chart"

  - it: refuses a podLabel that would override a selector label
    set:
      podLabels:
        app.kubernetes.io/instance: mine
    asserts:
      - failedTemplate:
          errorPattern: "selector label owned by the chart"

  - it: allows ordinary common labels
    set:
      commonLabels:
        team: platform
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses a generated pull Secret with no registry to key it on
    set:
      imageCredentials:
        create: true
        username: u
        password: p
      image:
        registry: ""
    asserts:
      - failedTemplate:
          errorMessage: "imageCredentials.create needs a registry to key the auth entry on: set imageCredentials.registry (image.registry is empty)."

  - it: refuses credentials hidden in a config URL value
    set:
      config:
        scanner:
          store:
            postgres:
              url: postgres://u:p@h:5432/scanner
    asserts:
      - failedTemplate:
          errorPattern: "embeds credentials in a URL"

  - it: refuses the pre-shared key in the ConfigMap passthrough
    # The name-based guard has to know about PSK: SCANNER_CLAIR_PSK matches
    # none of TOKEN, PASSWORD, SECRET, APIKEY or CREDENTIAL.
    set:
      config:
        scanner:
          clair:
            psk: c2VjcmV0
    asserts:
      - failedTemplate:
          errorPattern: "renders into a ConfigMap, which is not secret"

  - it: refuses config keys that flatten onto the same env var name
    set:
      config:
        a:
          b:
            c: 1
          b_c: 2
    asserts:
      - failedTemplate:
          errorPattern: "flatten to the same environment variable name"
