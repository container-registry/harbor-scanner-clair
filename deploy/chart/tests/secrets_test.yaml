---
suite: secret handling
release:
  name: t
tests:
  - it: inlines the Redis URL by default
    templates:
      - deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_STORE_REDIS_URL
            value: "redis://harbor-harbor-redis:6379"

  - it: keeps a Redis URL holding a password out of the pod spec
    templates:
      - deployment.yaml
    set:
      redis.existingSecret: redis-url
      redis.existingSecretKey: url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_STORE_REDIS_URL
            valueFrom:
              secretKeyRef:
                name: redis-url
                key: url
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_STORE_REDIS_URL
            value: "redis://harbor-harbor-redis:6379"
          any: true

  - it: uses the STORE_ infix the adapter actually reads
    templates:
      - deployment.yaml
    asserts:
      # pkg/etc/config.go tags the pool SCANNER_STORE_REDIS_*, not
      # SCANNER_REDIS_*. The shorter name would be silently ignored and the
      # adapter would fall back to its compiled-in default.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_REDIS_URL
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_STORE_REDIS_POOL_MAX_ACTIVE
            value: "5"

  - it: refuses an existing Redis Secret with no key named
    templates:
      - validate-values.yaml
    set:
      redis.existingSecret: redis-url
      redis.existingSecretKey: ""
    asserts:
      - failedTemplate:
          errorMessage: "redis.existingSecretKey must name the key holding the Redis URL in redis.existingSecret."

  - it: creates no TLS Secret and no DSN Secret by default
    templates:
      - secret.yaml
      - secret-tls.yaml
      - secret-env.yaml
    asserts:
      - hasDocuments:
          count: 0
