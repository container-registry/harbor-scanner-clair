---
suite: secret handling
release:
  name: t
tests:
  - it: keeps the store DSN out of the pod spec even when it comes from values
    templates:
      - deployment.yaml
    asserts:
      # Unlike clair.url, the DSN is never a literal env value: the password
      # rides in its userinfo, so the chart routes it through a Secret.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_STORE_POSTGRES_URL
            valueFrom:
              secretKeyRef:
                name: t-harbor-scanner-clair
                key: url

  - it: uses the STORE_ infix the adapter actually reads
    templates:
      - deployment.yaml
    asserts:
      # pkg/etc/config.go tags the store SCANNER_STORE_POSTGRES_*, not
      # SCANNER_POSTGRES_*. The shorter name would be silently ignored and the
      # adapter would fail its startup DSN check.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_POSTGRES_URL
          any: true

  - it: creates no TLS Secret and no passthrough Secret by default
    templates:
      - secret-tls.yaml
      - secret-env.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: creates no chart-managed Secret when every credential is externally owned
    templates:
      - secret.yaml
    set:
      postgres.existingSecret: harbor-scanner-clair-postgres
      clair.existingSecret: harbor-scanner-clair-psk
    asserts:
      - hasDocuments:
          count: 0
