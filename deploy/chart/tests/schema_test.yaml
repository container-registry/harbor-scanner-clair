---
# values.schema.json is enforced by Helm itself on template/install/lint, and it
# is the first thing a bad value hits. These cover the shapes that would
# otherwise reach the adapter as an unparsable env var, plus the closed root.
suite: values schema
release:
  name: t
templates:
  - deployment.yaml
tests:
  - it: rejects an unknown top-level key
    set:
      thisKeyDoesNotExist: 1
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'thisKeyDoesNotExist' not allowed"

  - it: rejects a scan job TTL that is not a Go duration
    set:
      store.scanJobTTL: abc
    asserts:
      - failedTemplate:
          errorPattern: "at '/store/scanJobTTL'"

  - it: rejects an empty scan job TTL, which the chart would emit verbatim
    set:
      store.scanJobTTL: ""
    asserts:
      # The chart emits SCANNER_STORE_SCAN_JOB_TTL unconditionally, so an empty
      # value reaches time.ParseDuration and fails the adapter at startup.
      - failedTemplate:
          errorPattern: "at '/store/scanJobTTL'"

  - it: rejects an API timeout that is not a Go duration
    set:
      api.readTimeout: 15seconds
    asserts:
      - failedTemplate:
          errorPattern: "at '/api/readTimeout'"

  - it: rejects a malformed image digest
    set:
      image.digest: sha256:short
    asserts:
      - failedTemplate:
          errorPattern: "at '/image/digest'"

  - it: rejects a store URL that is not a PostgreSQL DSN
    set:
      postgres.url: http://example.com
    asserts:
      - failedTemplate:
          errorPattern: "at '/postgres/url'"

  - it: rejects an unknown log level
    set:
      logLevel: verbose
    asserts:
      - failedTemplate:
          errorPattern: "at '/logLevel'"

  - it: rejects a values tree written for the Trivy adapter
    set:
      trivy:
        timeout: 5m0s
    asserts:
      # The closed root is what turns a copied-over values file into a named
      # failure rather than a chart that quietly ignores half of it.
      - failedTemplate:
          errorPattern: "additional properties 'trivy' not allowed"
