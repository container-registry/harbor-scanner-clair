---
# Every finding the doctor knows how to make. All of it renders fine and passes
# the schema, which is the point: these are the mistakes only a human would
# otherwise catch.
replicaCount: 1
clair:
  url: http://clair.clair.svc:6060
  psk: aHVudGVyMg==
api:
  tls:
    enabled: true
    certificate: CERT
    key: KEY
tls:
  insecureSkipVerify: true
extraCA:
  existingSecret: corp-ca
imageCredentials:
  create: true
  username: u
  password: p
podDisruptionBudget:
  enabled: true
  minAvailable: 1
store:
  # A development backend, and a TTL below the index deadline: a scan that uses
  # its full indexing budget expires before Harbor collects the report.
  backend: memory
  scanJobTTL: 5m
