---
suite: extra CA trust and registry credentials
release:
  name: t
tests:
  - it: mounts nothing and sets no CA variables by default
    templates:
      - deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: extra-ca
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_DIR
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_TLS_CLIENTCAS
          any: true

  - it: keeps the system bundle in SSL_CERT_DIR alongside the mount
    templates:
      - deployment.yaml
    set:
      extraCA.existingSecret: corp-ca
    asserts:
      # Go REPLACES its default directory list when SSL_CERT_DIR is set, so
      # dropping /etc/ssl/certs here would break every public TLS call.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_DIR
            value: "/etc/ssl/certs:/etc/scanner-clair/extra-ca"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-ca
            mountPath: /etc/scanner-clair/extra-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-ca
            secret:
              secretName: corp-ca

  - it: leaves SCANNER_TLS_CLIENTCAS unset for a whole-bundle mount
    templates:
      - deployment.yaml
    set:
      extraCA.existingSecret: corp-ca
    asserts:
      # With no keys named there is nothing to list: the chart cannot enumerate
      # the keys of a Secret it does not own, so SSL_CERT_DIR carries the mount.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_TLS_CLIENTCAS
          any: true

  - it: takes the bundle from a ConfigMap
    templates:
      - deployment.yaml
    set:
      extraCA.existingConfigMap: corp-ca
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-ca
            configMap:
              name: corp-ca

  - it: mounts only the named keys and lists their paths for the adapter
    templates:
      - deployment.yaml
    set:
      extraCA.existingSecret: corp-ca
      extraCA.keys:
        - root.crt
        - intermediate.crt
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name=="extra-ca")].secret.items
          value:
            - key: root.crt
              path: root.crt
            - key: intermediate.crt
              path: intermediate.crt
      # SCANNER_TLS_CLIENTCAS is the adapter's own outbound trust list: each
      # path is read and appended to x509.SystemCertPool at startup.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_TLS_CLIENTCAS
            value: "/etc/scanner-clair/extra-ca/root.crt,/etc/scanner-clair/extra-ca/intermediate.crt"

  - it: lets config claim SSL_CERT_DIR like any other variable
    templates:
      - deployment.yaml
    set:
      extraCA.existingSecret: corp-ca
      config:
        ssl_cert_dir: /custom
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_DIR
          any: true

  - it: refuses two competing CA sources
    templates:
      - validate-values.yaml
    set:
      extraCA.existingSecret: a
      extraCA.existingConfigMap: b
    asserts:
      - failedTemplate:
          errorMessage: "Set either extraCA.existingSecret or extraCA.existingConfigMap, not both."

  - it: creates no pull Secret by default
    templates:
      - secret-image-pull.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: builds a dockerconfigjson Secret and references it
    templates:
      - secret-image-pull.yaml
    set:
      imageCredentials.create: true
      imageCredentials.username: u
      imageCredentials.password: p
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      - equal:
          path: metadata.name
          value: t-harbor-scanner-clair-registry
      # {"auths":{"8gears.container-registry.com":{"auth":"dTpw","email":"","password":"p","username":"u"}}}
      # Keys are sorted because the template builds the map and calls toJson.
      # Regenerate with:
      #   helm template t deploy/chart --set imageCredentials.create=true \
      #     --set imageCredentials.username=u --set imageCredentials.password=p \
      #     | grep .dockerconfigjson:
      - equal:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6eyI4Z2VhcnMuY29udGFpbmVyLXJlZ2lzdHJ5LmNvbSI6eyJhdXRoIjoiZFRwdyIsImVtYWlsIjoiIiwicGFzc3dvcmQiOiJwIiwidXNlcm5hbWUiOiJ1In19fQ==

  - it: adds the generated Secret to imagePullSecrets without losing referenced ones
    templates:
      - deployment.yaml
    set:
      imageCredentials.create: true
      imageCredentials.username: u
      imageCredentials.password: p
      image.pullSecrets:
        - name: existing
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: t-harbor-scanner-clair-registry
            - name: existing

  - it: refuses incomplete registry credentials
    templates:
      - validate-values.yaml
    set:
      imageCredentials.create: true
      imageCredentials.username: u
    asserts:
      - failedTemplate:
          errorMessage: "imageCredentials.create requires imageCredentials.username and imageCredentials.password."

  - it: sets the Deployment's own annotations without touching the pods
    templates:
      - deployment.yaml
    set:
      deploymentAnnotations:
        argocd.argoproj.io/sync-wave: "1"
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
      - notExists:
          path: spec.template.metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: sets dual-stack fields on the Service
    templates:
      - service.yaml
    set:
      service.ipFamilyPolicy: PreferDualStack
      service.ipFamilies:
        - IPv4
        - IPv6
    asserts:
      - equal:
          path: spec.ipFamilyPolicy
          value: PreferDualStack
      - equal:
          path: spec.ipFamilies
          value:
            - IPv4
            - IPv6
