---
# The Clair backend: the one thing this adapter cannot be configured without.
# The chart does not deploy Clair, so every one of these is about pointing at
# a Clair 4.x server someone else runs, and authenticating to it.
suite: clair backend
release:
  name: t
tests:
  - it: points the adapter at the configured Clair endpoint
    templates:
      - deployment.yaml
    set:
      clair.url: http://clair.clair.svc:6060
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_CLAIR_URL
            value: "http://clair.clair.svc:6060"

  - it: keeps the adapter's own default when nothing is set
    templates:
      - deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_CLAIR_URL
            value: "http://clair:6060"

  - it: rejects a Clair URL that is not HTTP
    templates:
      - deployment.yaml
    set:
      clair.url: tcp://clair:6060
    asserts:
      - failedTemplate:
          errorPattern: "at '/clair/url'"

  - it: refuses an empty Clair URL with a sentence about operating one
    templates:
      - validate-values.yaml
    set:
      clair.url: ""
    asserts:
      - failedTemplate:
          errorMessage: "clair.url must name the Clair 4.x API endpoint the adapter indexes against; the chart does not deploy Clair."

  - it: emits the issuer and both Clair deadlines
    templates:
      - deployment.yaml
    asserts:
      # The index call is synchronous - Clair pulls and scans every layer
      # inside it - so its deadline is an order of magnitude above the others.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_CLAIR_JWT_ISSUER
            value: "harbor-scanner-clair"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_CLAIR_INDEX_TIMEOUT
            value: "10m"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_CLAIR_REQUEST_TIMEOUT
            value: "30s"

  - it: sets no pre-shared key by default
    templates:
      - deployment.yaml
    asserts:
      # Optional: a Clair with no `auth` stanza takes unauthenticated calls.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_CLAIR_PSK
          any: true

  - it: puts no pre-shared key in the chart-managed Secret when none is configured
    templates:
      - secret.yaml
    asserts:
      # The Secret itself still renders: it carries the store DSN. Only the
      # `psk` key is absent.
      - notExists:
          path: data.psk

  - it: stores an inlined pre-shared key in a chart-managed Secret and reads it back
    templates:
      - secret.yaml
      - deployment.yaml
    set:
      clair.psk: c2VjcmV0
    asserts:
      # Double base64: `data` is base64 of the raw value, and the raw value is
      # itself the base64 key Clair's auth.psk.key takes.
      - equal:
          path: data.psk
          value: YzJWamNtVjA=
        template: secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_CLAIR_PSK
            valueFrom:
              secretKeyRef:
                name: t-harbor-scanner-clair
                key: psk
        template: deployment.yaml

  - it: reads the pre-shared key from an existing Secret and key
    templates:
      - deployment.yaml
    set:
      clair.existingSecret: my-psk
      clair.existingSecretKey: key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_CLAIR_PSK
            valueFrom:
              secretKeyRef:
                name: my-psk
                key: key

  - it: puts no pre-shared key in the chart-managed Secret when the key is yours
    templates:
      - secret.yaml
    set:
      clair.existingSecret: my-psk
    asserts:
      - notExists:
          path: data.psk

  - it: refuses a pre-shared key that is both inlined and externally owned
    templates:
      - validate-values.yaml
    set:
      clair.existingSecret: my-psk
      clair.psk: c2VjcmV0
    asserts:
      - failedTemplate:
          errorMessage: "Set either clair.existingSecret or clair.psk, not both."

  - it: refuses an existing Secret with no key named
    templates:
      - validate-values.yaml
    set:
      clair.existingSecret: my-psk
      clair.existingSecretKey: ""
    asserts:
      - failedTemplate:
          errorMessage: "clair.existingSecretKey must name the key holding the base64 pre-shared key in clair.existingSecret."

  - it: refuses an empty issuer while a pre-shared key is set
    templates:
      - validate-values.yaml
    set:
      clair.psk: c2VjcmV0
      clair.jwtIssuer: ""
    asserts:
      - failedTemplate:
          errorMessage: "clair.jwtIssuer must not be empty when a pre-shared key is set: Clair validates the JWT `iss` claim against its auth.psk.iss allow-list, and an empty issuer matches nothing."

  - it: never emits the removed database URL
    templates:
      - deployment.yaml
    set:
      clair.psk: c2VjcmV0
    asserts:
      # Clair 4.x exposes updater state over HTTP, so the adapter no longer
      # reads Clair's database and no value produces this variable.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_CLAIR_DATABASE_URL
          any: true
