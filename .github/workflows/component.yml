---
name: Component

# Deliberately not a job in ci.yml. That workflow's schedule trigger exists so
# only vuln-check runs on cron, which every other job asserts with
# `if: github.event_name != 'schedule'`; a second cron with different semantics
# would make those conditions unreadable.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "pkg/**"
      - "test/component/**"
      - "Dockerfile"
      - "versions.env"
      - "go.mod"
      - "go.sum"
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: component-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    name: Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Not a merge gate yet. Measured once, on a laptop: Clair's matcher answers
    # after 16s, the first update cycle finishes at 85s, and the clair.cvss walk
    # of the NVD feeds peaks at 1805 MiB, which is 88% of the 2 GiB the tier was
    # budgeted. Time is not the problem, memory is, and one run is not a
    # distribution. Flip this to false and add "Component Tests" to the required
    # checks once a couple of weeks of nightly runs give a real p95 and no OOM.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Start the component stack
        run: task compose:up

      - name: Run the component tier
        run: task test:component

      - name: Collect stack logs
        if: always()
        run: |
          docker compose -f test/component/docker-compose.yml logs --no-color > component-logs.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: component-logs
          path: component-logs.txt
          if-no-files-found: warn

      - name: Tear down the component stack
        if: always()
        run: task compose:down
